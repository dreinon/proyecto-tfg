schema_version: 2
record_type: visual-fixture-manifest
manifest_id: phase2-engraved-visual-fixtures-v2
source_role: visual-degradation-review
content_policy: project-authored-cc0-no-smb
required_semantics: &required_semantics
  - clefs
  - key-signatures
  - time-signatures
  - staff-lines
  - barlines
  - pitched-notes
  - stems
  - beams
  - rests
  - accidentals
  - slurs
  - ties
  - articulations
  - dynamics
  - text-lyrics-digits
  - grand-staff-polyphony-chords
renderer:
  engraver:
    name: Verovio
    package: verovio
    version: 6.2.1
    project_url: https://www.verovio.org/
    source_format: MusicXML 4.0 partwise
    options:
      adjustPageHeight: true
      breaks: none
      footer: none
      header: none
      landscape: false
      pageHeight: 1800
      pageMarginBottom: 40
      pageMarginLeft: 40
      pageMarginRight: 40
      pageMarginTop: 40
      pageWidth: 2400
      scale: 130
  rasterizer:
    name: CairoSVG
    package: cairosvg
    version: 2.9.0
    project_url: https://cairosvg.org/
    canvas_width: 1600
    canvas_height: 900
    ink_threshold: 250
    crop_margin: 30
    canvas_inset: 60
limits:
  max_items: 8
  max_source_bytes: 1048576
